<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <style>
    .node { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 8; }
    .decision { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 8; }
    .db { fill: #dcfce7; stroke: #166534; stroke-width: 2; rx: 8; }
    .arrow { stroke: #4b5563; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .label { font-family: Arial; font-size: 12px; fill: #1f2937; }
    .title { font-family: Arial; font-size: 16px; font-weight: bold; fill: #1f2937; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" class="title">Service Order Flow</text>

  <!-- Start -->
  <rect x="450" y="60" width="100" height="40" class="node" />
  <text x="500" y="85" text-anchor="middle" class="label">Start</text>

  <!-- Guest Order / Frontdesk Order -->
  <path d="M500 100 L500 140" class="arrow" />
  <rect x="400" y="140" width="200" height="40" class="node" />
  <text x="500" y="165" text-anchor="middle" class="label">Guest/Frontdesk Create Order</text>

  <!-- Approve Order -->
  <path d="M500 180 L500 220" class="arrow" />
  <rect x="400" y="220" width="200" height="40" class="node" />
  <text x="500" y="245" text-anchor="middle" class="label">Manager Approve Order</text>

  <!-- Create SPK + Invoice -->
  <path d="M500 260 L500 300" class="arrow" />
  <rect x="400" y="300" width="200" height="40" class="node" />
  <text x="500" y="325" text-anchor="middle" class="label">Frontdesk Create SPK + Invoice</text>

  <!-- Approve SPK Invoice -->
  <path d="M500 340 L500 380" class="arrow" />
  <rect x="400" y="380" width="200" height="40" class="node" />
  <text x="500" y="405" text-anchor="middle" class="label">Manager Approve SPK/Invoice</text>

  <!-- Assign Technician -->
  <path d="M500 420 L500 460" class="arrow" />
  <rect x="400" y="460" width="200" height="40" class="node" />
  <text x="500" y="485" text-anchor="middle" class="label">Assign Technician</text>

  <!-- Technician Report -->
  <path d="M500 500 L500 540" class="arrow" />
  <rect x="400" y="540" width="200" height="40" class="node" />
  <text x="500" y="565" text-anchor="middle" class="label">Technician Submit Report</text>

  <!-- Edit Invoice -->
  <path d="M500 580 L500 620" class="arrow" />
  <rect x="400" y="620" width="200" height="40" class="node" />
  <text x="500" y="645" text-anchor="middle" class="label">Edit Invoice (if needed)</text>

  <!-- Record Payment -->
  <path d="M500 660 L500 700" class="arrow" />
  <rect x="400" y="700" width="200" height="40" class="node" />
  <text x="500" y="725" text-anchor="middle" class="label">Record Payment</text>

  <!-- Print Documents -->
  <path d="M500 740 L500 780" class="arrow" />
  <rect x="400" y="780" width="200" height="40" class="node" />
  <text x="500" y="805" text-anchor="middle" class="label">Print SPK/Invoice</text>

  <!-- End -->
  <path d="M500 820 L500 860" class="arrow" />
  <rect x="450" y="860" width="100" height="40" class="node" />
  <text x="500" y="885" text-anchor="middle" class="label">End</text>

  <!-- Decision Nodes -->
  <rect x="700" y="300" width="120" height="40" class="decision" />
  <text x="760" y="325" text-anchor="middle" class="label">Invoice OK?</text>
  <path d="M600 320 L700 320" class="arrow" />
  <path d="M760 340 L760 380" class="arrow" />
  <text x="730" y="360" text-anchor="middle" class="label">No</text>

  <rect x="700" y="460" width="120" height="40" class="decision" />
  <text x="760" y="485" text-anchor="middle" class="label">Report OK?</text>
  <path d="M600 480 L700 480" class="arrow" />
  <path d="M760 500 L760 540" class="arrow" />
  <text x="730" y="520" text-anchor="middle" class="label">No</text>
</svg>
