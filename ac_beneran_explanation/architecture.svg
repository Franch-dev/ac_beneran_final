<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <style>
    .component { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 8; }
    .db { fill: #dcfce7; stroke: #166534; stroke-width: 2; rx: 8; }
    .user { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 8; }
    .arrow { stroke: #4b5563; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .label { font-family: Arial; font-size: 12px; fill: #1f2937; }
    .title { font-family: Arial; font-size: 18px; font-weight: bold; fill: #1f2937; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" class="title">AC Beneran Platform Architecture</text>

  <!-- User -->
  <rect x="50" y="250" width="120" height="60" class="user" />
  <text x="110" y="285" text-anchor="middle" class="label">User</text>

  <!-- Frontend Layer -->
  <rect x="250" y="100" width="200" height="400" class="component" />
  <text x="350" y="130" text-anchor="middle" class="label" font-weight="bold">Frontend Layer</text>
  <rect x="270" y="150" width="160" height="40" class="component" />
  <text x="350" y="175" text-anchor="middle" class="label">Blade Templates</text>
  <rect x="270" y="210" width="160" height="40" class="component" />
  <text x="350" y="235" text-anchor="middle" class="label">Vite + Tailwind CSS</text>
  <rect x="270" y="270" width="160" height="40" class="component" />
  <text x="350" y="295" text-anchor="middle" class="label">Axios HTTP Client</text>
  <rect x="270" y="330" width="160" height="40" class="component" />
  <text x="350" y="355" text-anchor="middle" class="label">AnimeJS/AOS/GSAP</text>
  <rect x="270" y="390" width="160" height="40" class="component" />
  <text x="350" y="415" text-anchor="middle" class="label">Module Views</text>

  <!-- Backend Layer -->
  <rect x="500" y="100" width="200" height="400" class="component" />
  <text x="600" y="130" text-anchor="middle" class="label" font-weight="bold">Backend Layer</text>
  <rect x="520" y="150" width="160" height="40" class="component" />
  <text x="600" y="175" text-anchor="middle" class="label">Laravel 12</text>
  <rect x="520" y="210" width="160" height="40" class="component" />
  <text x="600" y="235" text-anchor="middle" class="label">Module Controllers</text>
  <rect x="520" y="270" width="160" height="40" class="component" />
  <text x="600" y="295" text-anchor="middle" class="label">Auth & Middleware</text>
  <rect x="520" y="330" width="160" height="40" class="component" />
  <text x="600" y="355" text-anchor="middle" class="label">Role-Based Access</text>
  <rect x="520" y="390" width="160" height="40" class="component" />
  <text x="600" y="415" text-anchor="middle" class="label">Scheduled Tasks</text>

  <!-- Database Layer -->
  <rect x="750" y="150" width="180" height="300" class="db" />
  <text x="840" y="180" text-anchor="middle" class="label" font-weight="bold">Database Layer</text>
  <rect x="770" y="200" width="140" height="40" class="db" />
  <text x="840" y="225" text-anchor="middle" class="label">main_platform</text>
  <rect x="770" y="260" width="140" height="40" class="db" />
  <text x="840" y="285" text-anchor="middle" class="label">ac_service_db</text>
  <rect x="770" y="320" width="140" height="40" class="db" />
  <text x="840" y="345" text-anchor="middle" class="label">inventory_db</text>
  <rect x="770" y="380" width="140" height="40" class="db" />
  <text x="840" y="405" text-anchor="middle" class="label">Sessions/Cache</text>

  <!-- Arrows -->
  <!-- User to Frontend -->
  <path d="M170 280 L250 280" class="arrow" />
  <!-- Frontend to Backend -->
  <path d="M450 280 L500 280" class="arrow" />
  <!-- Backend to Database -->
  <path d="M700 280 L750 280" class="arrow" />
  <!-- Backend to Modules -->
  <path d="M600 500 L600 550 L350 550 L350 500" class="arrow" />
  <!-- Module Label -->
  <text x="350" y="570" text-anchor="middle" class="label">5 Modules (AcService, AcAnggota, etc.)</text>
</svg>
